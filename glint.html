<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GLINT — proto 6128 · Labo gn</title>
<meta name="description" content="Casse-brique × tower defense. La dernière écharde de soleil contre la longue nuit bleue. Palette Amstrad CPC 6128.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#00006e;        /* CPC deep blue */
    --void2:#000040;
    --blue:#0000d8;
    --sky:#3a86ff;
    --gold:#ffd400;        /* CPC bright yellow */
    --gold2:#ffe23a;
    --pastel:#fff48f;
    --ink:#cfe6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#02021a;
    color:var(--ink);
    font-family:"JetBrains Mono",monospace;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  /* outer radial wash */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 18%, #0a0a5a 0%, #04042a 55%, #02021a 100%);
  }

  .frame{
    position:relative;z-index:1;
    box-shadow:0 0 0 2px #1a1a4a, 0 24px 60px -18px rgba(0,0,80,.9), 0 0 80px -10px rgba(58,134,255,.25);
    border-radius:6px;overflow:hidden;background:#000;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #base{z-index:1;image-rendering:pixelated;image-rendering:crisp-edges}
  #glow{z-index:2;mix-blend-mode:screen;opacity:.9;filter:blur(3px) saturate(1.5) brightness(1.25);pointer-events:none}

  /* CRT */
  .crt{position:absolute;inset:0;z-index:3;pointer-events:none}
  .crt::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 1px, rgba(0,0,30,.32) 1px, rgba(0,0,30,.32) 2px);
  }
  .crt::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,40,.55) 100%);
    mix-blend-mode:multiply;
  }

  /* HUD */
  .hud{position:absolute;z-index:4;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
    padding:6px 8px;font-size:10px;font-weight:700;letter-spacing:.06em;
    text-shadow:0 0 6px rgba(255,212,0,.5);pointer-events:none;
  }
  .hud .seg{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .hud .warm{color:var(--gold)}
  .hud .heart{color:#ff5a7a;text-shadow:0 0 6px rgba(255,90,122,.6)}
  .hud .glints{color:var(--pastel)}
  .hud .wave{color:var(--sky);text-shadow:0 0 6px rgba(58,134,255,.6)}

  /* tools */
  .tools{position:absolute;z-index:4;left:0;right:0;bottom:0;
    display:flex;gap:6px;padding:7px 8px;justify-content:center;
  }
  .tool{
    flex:1;max-width:150px;background:rgba(0,0,60,.55);border:1.5px solid #2b2b8a;
    border-radius:4px;color:var(--ink);font-family:inherit;font-size:10px;font-weight:700;
    letter-spacing:.05em;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:2px;transition:border-color .12s,background .12s,transform .08s;
    backdrop-filter:blur(2px);
  }
  .tool .ic{font-size:14px;line-height:1;color:var(--gold);text-shadow:0 0 8px rgba(255,212,0,.6)}
  .tool .cost{color:var(--pastel);opacity:.8;font-weight:500}
  .tool:active{transform:translateY(1px)}
  .tool.on{border-color:var(--gold);background:rgba(70,55,0,.55);box-shadow:0 0 14px -2px rgba(255,212,0,.5)}
  .tool.broke{opacity:.4}

  /* overlay */
  .overlay{position:absolute;z-index:5;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:14px;padding:26px;
    background:radial-gradient(120% 90% at 50% 40%, rgba(0,0,80,.62), rgba(0,0,20,.9));
    transition:opacity .25s;backdrop-filter:blur(1px);
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .logo{font-weight:800;letter-spacing:.18em;line-height:1;color:var(--gold);
    text-shadow:0 0 18px rgba(255,212,0,.6),0 0 2px #fff;font-size:clamp(38px,13vw,62px);}
  .logo .sub{display:block;font-size:10px;letter-spacing:.34em;color:var(--sky);
    margin-top:10px;text-shadow:0 0 8px rgba(58,134,255,.6)}
  .ov-h{font-weight:800;letter-spacing:.04em;font-size:clamp(22px,7vw,34px);color:var(--gold)}
  .ov-p{font-size:11px;line-height:1.9;letter-spacing:.04em;color:var(--ink);max-width:30ch;opacity:.92}
  .ov-p b{color:var(--gold2)}
  .ov-p .cold{color:var(--sky)}
  .press{font-size:10px;letter-spacing:.22em;color:var(--pastel);text-transform:uppercase;
    margin-top:4px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}

  .back{position:absolute;z-index:6;top:6px;left:50%;transform:translateX(-50%);
    font-size:9px;letter-spacing:.18em;color:#6f7fb5;text-decoration:none;text-transform:uppercase;
    opacity:.0;transition:opacity .3s;pointer-events:none}
  .frame:hover .back{opacity:.7;pointer-events:auto}
  @media (hover:none){.back{opacity:.55;pointer-events:auto;top:auto;bottom:62px}}
</style>
</head>
<body>
  <div class="frame" id="frame">
    <canvas id="base"></canvas>
    <canvas id="glow"></canvas>
    <div class="crt"></div>
    <div class="hud" id="hud">
      <span class="seg warm">☀ <span id="hWarm">0</span></span>
      <span class="seg wave">VAGUE <span id="hWave">0</span>/4</span>
      <span class="seg glints">◇ <span id="hLives">3</span></span>
      <span class="seg heart">♥ <span id="hHeart">5</span></span>
    </div>
    <div class="tools" id="tools">
      <button class="tool" data-tool="refractor"><span class="ic">◆</span><span>Réfracteur</span><span class="cost">☀3 · dévie</span></button>
      <button class="tool" data-tool="forge"><span class="ic">▲</span><span>Forge</span><span class="cost">☀5 · tire</span></button>
    </div>
    <div class="overlay" id="overlay">
      <div class="logo">GLINT<span class="sub">PROTO · 6128</span></div>
      <p class="ov-p">La dernière écharde de soleil contre la <span class="cold">longue nuit bleue</span>.<br>
      Lance le <b>Glint</b>, garde-le en vie, brise les <span class="cold">Frostforms</span> avant qu'elles n'atteignent le <b>Foyer</b>.</p>
      <div class="press" id="press">Toucher pour veiller</div>
    </div>
    <a class="back" href="index.html">← labo</a>
  </div>

<script>
(function(){
  "use strict";
  // ---------- pixel buffer ----------
  const VW=180, VH=320;
  const base=document.getElementById('base'), bctx=base.getContext('2d');
  const glow=document.getElementById('glow'), gctx=glow.getContext('2d');
  base.width=glow.width=VW; base.height=glow.height=VH;
  bctx.imageSmoothingEnabled=false; gctx.imageSmoothingEnabled=false;
  const frame=document.getElementById('frame');

  function fit(){
    const availH=Math.min(window.innerHeight-12, 780);
    const availW=Math.min(window.innerWidth-12, 460);
    let s=Math.min(availW/VW, availH/VH);
    s=Math.max(1, Math.floor(s*100)/100);
    const w=Math.round(VW*s), h=Math.round(VH*s);
    frame.style.width=w+'px'; frame.style.height=h+'px';
  }
  addEventListener('resize',fit); fit();

  // ---------- palette ----------
  const C={
    void1:'#00006e', void2:'#000038', grid:'#11118c',
    foe:'#5fa0ff', foeEdge:'#bfe0ff', foeCore:'#ffffff', foeArm:'#9a86ff',
    gold:'#ffd400', gold2:'#ffe23a', pastel:'#fff48f', white:'#ffffff',
    paddle:'#ffd400', hearth:'#ffcf2b', danger:'#2b2bb0'
  };

  // ---------- world ----------
  const FX0=10, FW=VW-20, CELL=20, COLS=8;
  const DANGER_Y=288;
  const paddle={x:VW/2, y:298, w:30, h:4, speed:3};
  const glint={x:VW/2, y:292, r:2.6, vx:0, vy:0, docked:true, sp:1.85};
  const TRAIL=10; let trail=[];

  let foes=[], towers=[], bolts=[], parts=[];
  let formY=24, descent=0.05;
  let warmth=0, heartHP=5, lives=3, wave=0;
  let tool=null, shake=0, freeze=0, state='title';
  let dawn=0; // win glow

  const WAVES=[
    {rows:3, hp:1, sp:0.045},
    {rows:4, hp:1, sp:0.052},
    {rows:4, hp:2, sp:0.060},
    {rows:5, hp:2, sp:0.070}
  ];

  // ---------- helpers ----------
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  function rng(seed){ // deterministic-ish per call not needed; use Math via wrapper avoided
    return Math.random();
  }
  function setSpeed(o,sp){
    const m=Math.hypot(o.vx,o.vy)||1; o.vx=o.vx/m*sp; o.vy=o.vy/m*sp;
    // avoid near-horizontal lock
    if(Math.abs(o.vy)<sp*0.35){ o.vy = (o.vy<0?-1:1)*sp*0.35; setSpeed2(o,sp); }
  }
  function setSpeed2(o,sp){ const m=Math.hypot(o.vx,o.vy)||1; o.vx=o.vx/m*sp; o.vy=o.vy/m*sp; }

  // ---------- HUD ----------
  const hWarm=document.getElementById('hWarm'), hWave=document.getElementById('hWave'),
        hLives=document.getElementById('hLives'), hHeart=document.getElementById('hHeart');
  function syncHUD(){
    hWarm.textContent=warmth; hWave.textContent=Math.max(1,wave);
    hLives.textContent=lives; hHeart.textContent=heartHP;
    document.querySelectorAll('.tool').forEach(t=>{
      const cost=t.dataset.tool==='refractor'?3:5;
      t.classList.toggle('broke', warmth<cost);
      t.classList.toggle('on', tool===t.dataset.tool);
    });
  }

  // ---------- overlay ----------
  const overlay=document.getElementById('overlay'), press=document.getElementById('press');
  function showOverlay(html){ overlay.innerHTML=html; overlay.classList.remove('hidden'); }
  function hideOverlay(){ overlay.classList.add('hidden'); }

  // ---------- spawn ----------
  function buildWave(n){
    const w=WAVES[n-1]; descent=w.sp; formY=20;
    foes=[];
    for(let r=0;r<w.rows;r++){
      for(let c=0;c<COLS;c++){
        // sparse gaps for texture
        if(n>=2 && Math.random()<0.12) continue;
        foes.push({c,r,hp:w.hp,maxhp:w.hp,alive:true,hit:0});
      }
    }
  }
  function foePos(f){ return {x:FX0+f.c*CELL+CELL/2, y:formY+f.r*CELL+CELL/2}; }

  // ---------- game flow ----------
  function startGame(){
    warmth=6; heartHP=5; lives=3; wave=0; towers=[]; bolts=[]; parts=[]; tool=null; dawn=0;
    nextWave();
  }
  function nextWave(){
    wave++;
    if(wave>WAVES.length){ win(); return; }
    buildWave(wave);
    dockGlint();
    state='playing'; hideOverlay(); syncHUD();
  }
  function waveCleared(){
    if(wave>=WAVES.length){ win(); return; }
    warmth+=4;
    state='msg'; syncHUD();
    showOverlay('<div class="ov-h" style="color:var(--gold)">VAGUE '+wave+' TENUE</div>'+
      '<p class="ov-p">Le Foyer respire. <b>+4 ☀</b> de chaleur récupérée.<br>Place tes tours, puis rallume le Glint.</p>'+
      '<div class="press">Toucher pour la vague '+(wave+1)+'</div>');
  }
  function lose(reason){
    state='over';
    showOverlay('<div class="ov-h" style="color:#ff5a7a">LE FOYER S\'ÉTEINT</div>'+
      '<p class="ov-p">'+reason+'<br>La nuit bleue avale le dernier éclat. Atteint : <b>vague '+wave+'</b>.</p>'+
      '<div class="press">Toucher pour rallumer</div>');
  }
  function win(){
    state='won'; dawn=1;
    showOverlay('<div class="logo" style="font-size:42px">L\'AUBE<span class="sub" style="color:var(--gold)">le Glint a tenu</span></div>'+
      '<p class="ov-p">Quatre vagues. Le froid reflue. Une ligne d\'or fend l\'horizon — <b>tu as gardé la lumière</b>.</p>'+
      '<div class="press">Toucher pour recommencer</div>');
  }
  function dockGlint(){ glint.docked=true; glint.x=paddle.x; glint.y=paddle.y-glint.r-1; glint.vx=0; glint.vy=0; trail=[]; }
  function launchGlint(){
    glint.docked=false;
    const off=(glint.x-paddle.x)/(paddle.w/2);
    glint.vx=off*0.8; glint.vy=-1; setSpeed(glint,glint.sp);
  }

  // ---------- input ----------
  let pointerDown=false;
  function toGame(clientX){ const r=base.getBoundingClientRect(); return clamp((clientX-r.left)/r.width*VW,0,VW); }
  function toGameY(clientY){ const r=base.getBoundingClientRect(); return clamp((clientY-r.top)/r.height*VH,0,VH); }

  function placeTower(gx,gy){
    if(gy<120||gy>278) return;
    const col=Math.floor((gx-FX0)/CELL), row=Math.floor((gy-20)/CELL);
    const cx=FX0+col*CELL+CELL/2, cy=20+row*CELL+CELL/2;
    if(cx<FX0+4||cx>FX0+FW-4) return;
    if(towers.some(t=>Math.abs(t.x-cx)<6&&Math.abs(t.y-cy)<6)) return;
    const cost=tool==='refractor'?3:5;
    if(warmth<cost){ tool=null; syncHUD(); return; }
    warmth-=cost;
    towers.push({x:cx,y:cy,type:tool,cd:0,pulse:0});
    tool=null; syncHUD();
    spawnParts(cx,cy,6,C.gold);
  }

  function onDown(clientX,clientY){
    if(state==='title'){ startGame(); return; }
    if(state==='msg'){ nextWave(); return; }
    if(state==='over'||state==='won'){ overlay.classList.add('hidden'); startGame(); return; }
    if(state!=='playing') return;
    const gx=toGame(clientX), gy=toGameY(clientY);
    if(tool){ placeTower(gx,gy); return; }
    pointerDown=true;
    paddle.x=clamp(gx,paddle.w/2,VW-paddle.w/2);
    if(glint.docked) launchGlint();
  }
  function onMove(clientX){
    if(state!=='playing'||tool||!pointerDown) return;
    paddle.x=clamp(toGame(clientX),paddle.w/2,VW-paddle.w/2);
  }
  function onUp(){ pointerDown=false; }

  frame.addEventListener('pointerdown',e=>{ if(e.target.closest('.tool')||e.target.closest('.back'))return; e.preventDefault(); onDown(e.clientX,e.clientY); },{passive:false});
  frame.addEventListener('pointermove',e=>{ onMove(e.clientX); },{passive:false});
  addEventListener('pointerup',onUp); addEventListener('pointercancel',onUp);

  document.getElementById('tools').addEventListener('click',e=>{
    const b=e.target.closest('.tool'); if(!b||state!=='playing')return;
    const t=b.dataset.tool, cost=t==='refractor'?3:5;
    if(warmth<cost){ return; }
    tool = tool===t? null : t;
    syncHUD();
  });

  // keyboard (desktop)
  const keys={};
  addEventListener('keydown',e=>{ keys[e.key]=true;
    if(e.key===' '){ e.preventDefault(); if(state==='playing'&&glint.docked)launchGlint(); else onDown(innerWidth/2,innerHeight/2);} });
  addEventListener('keyup',e=>{ keys[e.key]=false; });

  // ---------- particles ----------
  function spawnParts(x,y,n,col){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=0.4+Math.random()*1.6;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.3,life:1,col});
    }
  }

  // ---------- update ----------
  function update(){
    if(state==='won'){ return; }
    if(state!=='playing'){ return; }
    if(freeze>0){ freeze--; return; }

    // keyboard paddle
    if(keys['ArrowLeft']||keys['a']) paddle.x=clamp(paddle.x-paddle.speed,paddle.w/2,VW-paddle.w/2);
    if(keys['ArrowRight']||keys['d']) paddle.x=clamp(paddle.x+paddle.speed,paddle.w/2,VW-paddle.w/2);

    // formation descent
    formY+=descent;

    // glint
    if(glint.docked){ glint.x=paddle.x; glint.y=paddle.y-glint.r-1; }
    else {
      glint.x+=glint.vx; glint.y+=glint.vy;
      trail.push({x:glint.x,y:glint.y}); if(trail.length>TRAIL)trail.shift();

      // walls
      if(glint.x-glint.r<2){ glint.x=2+glint.r; glint.vx=Math.abs(glint.vx); }
      if(glint.x+glint.r>VW-2){ glint.x=VW-2-glint.r; glint.vx=-Math.abs(glint.vx); }
      if(glint.y-glint.r<14){ glint.y=14+glint.r; glint.vy=Math.abs(glint.vy); }

      // paddle
      if(glint.vy>0 && glint.y+glint.r>=paddle.y && glint.y<paddle.y+6 &&
         glint.x>paddle.x-paddle.w/2-2 && glint.x<paddle.x+paddle.w/2+2){
        glint.y=paddle.y-glint.r;
        const off=clamp((glint.x-paddle.x)/(paddle.w/2),-1,1);
        glint.vx=off*1.1; glint.vy=-1; setSpeed(glint,glint.sp);
      }

      // towers (refractor bounce)
      for(const t of towers){
        if(t.type!=='refractor')continue;
        const dx=glint.x-t.x, dy=glint.y-t.y, d=Math.hypot(dx,dy), rr=glint.r+5;
        if(d<rr){
          const nx=dx/(d||1), ny=dy/(d||1), dot=glint.vx*nx+glint.vy*ny;
          glint.vx-=2*dot*nx; glint.vy-=2*dot*ny;
          glint.x=t.x+nx*rr; glint.y=t.y+ny*rr;
          setSpeed(glint, Math.min(glint.sp*1.0, glint.sp));
          t.pulse=1; spawnParts(glint.x,glint.y,3,C.gold2);
        }
      }

      // foes
      for(const f of foes){
        if(!f.alive)continue;
        const p=foePos(f);
        const nx=clamp(glint.x,p.x-8,p.x+8), ny=clamp(glint.y,p.y-8,p.y+8);
        const dx=glint.x-nx, dy=glint.y-ny;
        if(dx*dx+dy*dy<glint.r*glint.r){
          if(Math.abs(glint.x-p.x)>Math.abs(glint.y-p.y)) glint.vx=-glint.vx;
          else glint.vy=-glint.vy;
          setSpeed(glint,glint.sp);
          glint.x+=glint.vx*0.5; glint.y+=glint.vy*0.5;
          hitFoe(f,p);
          break;
        }
      }

      // fell
      if(glint.y-glint.r>VH){
        lives--; syncHUD();
        if(lives<0){ lose('Le Glint a sombré dans le vide. Plus aucun éclat à lancer.'); }
        else { dockGlint(); }
      }
    }

    // towers: forge fire
    for(const t of towers){
      if(t.pulse>0)t.pulse-=0.08;
      if(t.type!=='forge')continue;
      t.cd--;
      if(t.cd<=0){
        let best=null,bd=1e9;
        for(const f of foes){ if(!f.alive)continue; const p=foePos(f); const d=Math.hypot(p.x-t.x,p.y-t.y); if(d<bd){bd=d;best=p;} }
        if(best){
          const a=Math.atan2(best.y-t.y,best.x-t.x);
          bolts.push({x:t.x,y:t.y,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4,life:90});
          t.cd=70; t.pulse=1;
        } else t.cd=20;
      }
    }
    // bolts
    for(const b of bolts){
      b.x+=b.vx; b.y+=b.vy; b.life--;
      for(const f of foes){ if(!f.alive)continue; const p=foePos(f);
        if(Math.abs(b.x-p.x)<8&&Math.abs(b.y-p.y)<8){ hitFoe(f,p); b.life=0; break; } }
    }
    bolts=bolts.filter(b=>b.life>0 && b.y>10 && b.y<VH && b.x>0 && b.x<VW);

    // foe reaching hearth
    for(const f of foes){ if(!f.alive)continue; const p=foePos(f);
      if(p.y+8>=DANGER_Y){ f.alive=false; heartHP--; shake=6; spawnParts(p.x,DANGER_Y,10,C.foe); syncHUD();
        if(heartHP<=0){ lose('Une Frostform a touché le Foyer. La chaleur s\'effondre.'); } } }

    // hit flash decay
    for(const f of foes){ if(f.hit>0)f.hit-=0.12; }

    // cleared?
    if(state==='playing' && foes.every(f=>!f.alive)){ waveCleared(); }

    // particles
    for(const pt of parts){ pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.05; pt.life-=0.04; }
    parts=parts.filter(p=>p.life>0);

    if(shake>0)shake*=0.85;
  }

  function hitFoe(f,p){
    f.hp--; f.hit=1;
    if(f.hp<=0){
      f.alive=false; warmth+=(f.maxhp>=2?2:1); shake=Math.max(shake,3.5); freeze=2;
      spawnParts(p.x,p.y,9,C.foeEdge); spawnParts(p.x,p.y,4,C.pastel);
      syncHUD();
    } else { spawnParts(p.x,p.y,3,C.foeEdge); }
  }

  // ---------- draw ----------
  function drawScene(ctx,emit){
    if(!emit){
      // background
      const g=ctx.createLinearGradient(0,0,0,VH);
      g.addColorStop(0,C.void2); g.addColorStop(.55,C.void1); g.addColorStop(1,'#000026');
      ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
      // subtle grid
      ctx.fillStyle=C.grid;
      for(let y=20;y<VH;y+=20){ ctx.globalAlpha=.25; ctx.fillRect(8,y,VW-16,1); }
      for(let x=FX0;x<=FX0+FW;x+=CELL){ ctx.fillRect(x,20,1,DANGER_Y-20); }
      ctx.globalAlpha=1;
      // danger line
      ctx.fillStyle=C.danger;
      for(let x=4;x<VW;x+=6){ ctx.fillRect(x,DANGER_Y,3,1); }
      // foes
      for(const f of foes){ if(!f.alive)continue; const p=foePos(f);
        drawFoe(ctx,p.x,p.y,f);
      }
    }
    // --- emissive (drawn on both passes) ---
    // towers
    for(const t of towers) drawTower(ctx,t);
    // hearth
    drawHearth(ctx);
    // paddle
    ctx.fillStyle=C.paddle;
    roundRect(ctx,paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h,2); ctx.fill();
    ctx.fillStyle=C.pastel; ctx.fillRect(paddle.x-2,paddle.y,4,1);
    // bolts
    for(const b of bolts){ ctx.fillStyle=C.gold2; ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-1,3,3);
      ctx.fillStyle=C.white; ctx.fillRect(Math.round(b.x),Math.round(b.y),1,1); }
    // glint trail
    for(let i=0;i<trail.length;i++){ const a=i/trail.length; ctx.globalAlpha=a*0.5;
      ctx.fillStyle=C.gold; const t=trail[i]; ctx.fillRect(Math.round(t.x)-1,Math.round(t.y)-1,2,2); }
    ctx.globalAlpha=1;
    // glint
    if(state==='playing'||emit){
      const gx=Math.round(glint.x), gy=Math.round(glint.y);
      ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(gx,gy,glint.r,0,7); ctx.fill();
      ctx.fillStyle=C.white; ctx.fillRect(gx-1,gy-1,2,2);
    }
    // particles
    for(const p of parts){ ctx.globalAlpha=clamp(p.life,0,1);
      ctx.fillStyle=p.col; ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1); }
    ctx.globalAlpha=1;
    // dawn line on win
    if(dawn>0 && emit){ ctx.fillStyle=C.gold; ctx.globalAlpha=.5; ctx.fillRect(0,150,VW,2); ctx.globalAlpha=1; }
  }

  function drawFoe(ctx,x,y,f){
    const s=7;
    // body diamond
    ctx.save(); ctx.translate(Math.round(x),Math.round(y));
    ctx.fillStyle = f.hit>0? C.white : (f.maxhp>=2? C.foeArm : C.foe);
    ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle=C.foeEdge; ctx.fillRect(-1,-s,2,2); ctx.fillRect(-1,s-2,2,2);
    ctx.fillStyle=C.foeCore; ctx.fillRect(-1,-1,2,2);
    if(f.maxhp>=2 && f.hp>=2){ ctx.fillStyle=C.white; ctx.fillRect(-3,-3,1,1); ctx.fillRect(2,2,1,1); }
    ctx.restore();
  }

  function drawTower(ctx,t){
    const x=Math.round(t.x), y=Math.round(t.y);
    if(t.type==='refractor'){
      ctx.fillStyle=C.gold; ctx.beginPath();
      ctx.moveTo(x,y-5); ctx.lineTo(x+5,y); ctx.lineTo(x,y+5); ctx.lineTo(x-5,y); ctx.closePath(); ctx.fill();
      ctx.fillStyle=C.white; ctx.fillRect(x-1,y-1,2,2);
      if(t.pulse>0){ ctx.globalAlpha=t.pulse*0.6; ctx.strokeStyle=C.pastel; ctx.lineWidth=1;
        ctx.strokeRect(x-6,y-6,12,12); ctx.globalAlpha=1; }
    } else {
      ctx.fillStyle=C.gold;
      ctx.beginPath(); ctx.moveTo(x,y-6); ctx.lineTo(x+5,y+4); ctx.lineTo(x-5,y+4); ctx.closePath(); ctx.fill();
      ctx.fillStyle=C.pastel; ctx.fillRect(x-1,y-2,2,2);
      ctx.fillStyle=C.white; ctx.fillRect(x-1,y-4,2,1);
    }
  }

  function drawHearth(ctx){
    const hx=VW/2, hy=308;
    // hearth base
    const flick=0.85+0.15*Math.sin(perf*0.15);
    ctx.globalAlpha=1;
    ctx.fillStyle=C.hearth; roundRect(ctx,hx-14,hy-3,28,9,2); ctx.fill();
    ctx.fillStyle=C.gold2; ctx.globalAlpha=flick;
    ctx.beginPath(); ctx.arc(hx,hy,5,0,7); ctx.fill();
    ctx.fillStyle=C.white; ctx.globalAlpha=flick; ctx.fillRect(hx-1,hy-2,2,2);
    ctx.globalAlpha=1;
    // little rays
    ctx.fillStyle=C.pastel; ctx.globalAlpha=0.5*flick;
    ctx.fillRect(hx-1,hy-9,2,3); ctx.fillRect(hx-9,hy-1,3,2); ctx.fillRect(hx+6,hy-1,3,2);
    ctx.globalAlpha=1;
    // heart hp pips
    for(let i=0;i<5;i++){ ctx.fillStyle = i<heartHP? C.gold : '#332a00';
      ctx.fillRect(hx-12+i*6, hy+8, 3, 2); }
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  // ---------- loop ----------
  let perf=0;
  function render(){
    const sx=shake>0.2?(Math.random()*2-1)*shake:0, sy=shake>0.2?(Math.random()*2-1)*shake:0;
    bctx.setTransform(1,0,0,1,Math.round(sx),Math.round(sy));
    gctx.setTransform(1,0,0,1,Math.round(sx),Math.round(sy));
    gctx.clearRect(-10,-10,VW+20,VH+20);
    drawScene(bctx,false);
    drawScene(gctx,true);
    bctx.setTransform(1,0,0,1,0,0); gctx.setTransform(1,0,0,1,0,0);
  }
  function tick(){ perf++; update(); render(); requestAnimationFrame(tick); }
  syncHUD(); tick();
})();
</script>
</body>
</html>
